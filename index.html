<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal GitHub Sync Demo</title>
  
  <!-- Step 1: Include Module CSS -->
  <link rel="stylesheet" href="github-sync-module.css" />

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .controls-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button.app-btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-sync {
      background: #2563eb;
      color: #fff;
    }
    .btn-sync:hover { background: #1d4ed8; }

    .btn-download {
      background: #059669;
      color: #fff;
    }
    .btn-download:hover { background: #047857; }

    .btn-disconnect {
      background: #dc2626;
      color: #fff;
    }
    .btn-disconnect:hover { background: #b91c1c; }

    .btn-purge {
      background: #4b5563;
      color: #fff;
    }
    .btn-purge:hover { background: #374151; }

    textarea.content-area {
      width: 100%;
      height: 200px;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #f3f4f6;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
      outline: none;
      margin-bottom: 14px;
    }

    textarea.content-area:focus {
      border-color: #3b82f6;
    }

    .status-log {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #10b981;
      height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Universal GitHub Encrypted Sync</h1>
    <p class="subtitle">Zero Plaintext Persistence &bull; Web Crypto AES-GCM &bull; GitHub Secret Gist</p>

    <div class="controls-panel">
      <button class="app-btn btn-sync" id="btn-upload">Commit / Upload (Prompt)</button>
      <button class="app-btn btn-download" id="btn-download">Pull / Download</button>
      <button class="app-btn btn-disconnect" id="btn-disconnect">Disconnect (Purge RAM)</button>
      <button class="app-btn btn-purge" id="btn-clear-db">Reset Profile</button>
    </div>

    <textarea class="content-area" id="editor" placeholder="Write or sync your encrypted data payload here..."></textarea>

    <div class="status-log" id="log-window">System initialized. Awaiting user interaction...</div>
  </div>

  <!-- Step 2: Include Module Script -->
  <script src="github-sync-module.js"></script>

  <!-- Step 3: Application Integration Logic -->
  <script>
    const logger = (msg) => {
      const el = document.getElementById('log-window');
      const time = new Date().toLocaleTimeString();
      el.innerHTML = `[${time}] ${msg}<br/>` + el.innerHTML;
    };

    // Initialize Module
    const ghSync = new GitHubSyncModule();

    // Event Subscriptions
    ghSync.on('stateChange', ({ state, meta }) => {
      logger(`State changed to: <strong>${state}</strong> ${meta ? `(${meta})` : ''}`);
    });

    ghSync.on('syncComplete', (event) => {
      logger(`Sync Completed: <em>${event.action}</em>`);
      if (event.action === 'initialSync' || event.action === 'download') {
        if (event.data !== undefined) {
          document.getElementById('editor').value = event.data;
        }
      }
    });

    ghSync.on('error', (err) => {
      logger(`<span style="color: #ef4444;">Error: ${err.message || err}</span>`);
    });

    // Boot Module on page load
    ghSync.init();

    // App Control Listeners
    document.getElementById('btn-upload').onclick = async () => {
      const content = document.getElementById('editor').value;
      if (!content) {
        alert('Editor is empty.');
        return;
      }
      try {
        await ghSync.promptUploadChoice(content);
      } catch (err) {
        alert('Upload Error: ' + err.message);
      }
    };

    document.getElementById('btn-download').onclick = async () => {
      try {
        logger('Fetching remote payload...');
        const plain = await ghSync.downloadData();
        document.getElementById('editor').value = plain;
        logger('Payload decrypted and loaded to editor.');
      } catch (err) {
        alert('Download Error: ' + err.message);
      }
    };

    document.getElementById('btn-disconnect').onclick = () => {
      ghSync.disconnect();
      logger('RAM scrubbed. Session terminated.');
    };

    document.getElementById('btn-clear-db').onclick = async () => {
      if (confirm('This will wipe your stored profile from IndexedDB and disconnect.')) {
        await ghSync.purgeCredentials();
        logger('IndexedDB profile deleted.');
      }
    };
  </script>
</body>
</html>
